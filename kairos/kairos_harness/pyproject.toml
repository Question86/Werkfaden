[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-context-harness"
version = "0.1.0-alpha.2"
description = "Heartbeat-based KAIROS context acquisition and knowledge promotion harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kairos = "kairos.cli:main"

[tool.setuptools]
packages = ["kairos"]

[tool.setuptools.package-data]
kairos = ["framework.db", "framework_manifest.json", "quarantine/*.txt"]
