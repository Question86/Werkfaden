name: V3 step2 framework contract rebuild

on:
  push:
    branches: [v3]
    paths:
      - scripts/apply_v3_step2_contract_patch.py
      - scripts/fix_v3_step2_query_collision.py
      - .github/workflows/v3-step2-apply.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply committed framework contract patch
        run: python scripts/apply_v3_step2_contract_patch.py
      - name: Disambiguate onboarding search ownership
        run: python scripts/fix_v3_step2_query_collision.py
      - name: Rebuild deterministic framework search projection
        run: python scripts/build_framework_index.py --verify-determinism
      - name: Compile changed Python surfaces
        run: python -m compileall -q kickstart kairos/kairos_harness workshop/src scripts
      - name: Verify framework bootstrap contracts
        env:
          PYTHONPATH: kairos/kairos_harness
        run: python -m unittest discover -s kairos/kairos_harness/tests -p 'test_framework_bootstrap.py' -v
      - name: Commit framework contract and derived projection
        run: |
          git config user.name "Q86 v3 automation"
          git config user.email "113774086+Question86@users.noreply.github.com"
          git add \
            AGENTS.md \
            docs/FRAMEWORK_BOOTSTRAP.md \
            docs/PROJECT_KICKSTART.md \
            docs/WORKSHOP.md \
            docs/UNIVERSAL_ONBOARDING.md \
            scripts/build_framework_index.py \
            kairos/kairos_harness/kairos/framework.py \
            kairos/kairos_harness/kairos/framework.db \
            kairos/kairos_harness/kairos/framework_manifest.json \
            kairos/kairos_harness/tests/test_framework_bootstrap.py
          if git diff --cached --quiet; then
            echo "No framework rebuild changes"
          else
            git commit -m "feat: close universal framework bootstrap contract"
            git push origin HEAD:v3
          fi
