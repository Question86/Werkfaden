name: Growth rollout integrity

on:
  push:
    branches: [growth-rollout, v3]
    paths:
      - '.github/README.md'
      - '.github/ISSUE_TEMPLATE/adoption-feedback.yml'
      - '.github/workflows/growth-rollout-gate.yml'
      - 'docs/growth/**'
      - 'CITATION.cff'
  pull_request:
    branches: [v3]
    paths:
      - '.github/README.md'
      - '.github/ISSUE_TEMPLATE/adoption-feedback.yml'
      - '.github/workflows/growth-rollout-gate.yml'
      - 'docs/growth/**'
      - 'CITATION.cff'

permissions:
  contents: read

concurrency:
  group: growth-rollout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove all engine and admitted framework bytes remain unchanged
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = '13db71aa841c7859e68f5728d0c925ea76343e20'
          actual = subprocess.check_output(['git', 'rev-parse', 'v0.1.0-alpha.6^{commit}'], text=True).strip()
          if actual != base:
              raise SystemExit('Pinned engine tag identity changed')
          allowed = {
              '.github/README.md',
              '.github/ISSUE_TEMPLATE/adoption-feedback.yml',
              '.github/workflows/growth-rollout-gate.yml',
              'CITATION.cff',
              'docs/growth/BRAND.md',
              'docs/growth/START_HERE.md',
              'docs/growth/EVIDENCE.md',
              'docs/growth/SOCIAL.md',
              'docs/growth/ROLLOUT.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Non-rollout changes detected: {unexpected}')
          print(f'PASS: {len(changed)} presentation/CI files; all other tracked bytes equal pinned engine')
          PY

      - name: Check public links, attribution and bounded social copy
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          root = Path('.').resolve()
          canonical = 'https://github.com/Question86/Werkfaden'
          files = [Path('.github/README.md'), Path('CITATION.cff'), *sorted(Path('docs/growth').glob('*.md'))]
          checked = 0
          for path in files:
              raw = path.read_text(encoding='utf-8')
              for target in re.findall(r'https?://[^\s<>"\x27)]+', raw):
                  parsed = urlsplit(target)
                  if parsed.hostname in {'github.com', 'api.github.com', 'raw.githubusercontent.com'}:
                      if re.search(r'(?:^|/)question86/kairos-golden(?:/|\.|$)', parsed.path, flags=re.I):
                          raise SystemExit(f'Obsolete public repository URL: {path}: {target}')
              text = re.sub(r'```.*?```', '', raw, flags=re.S)
              for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', text):
                  parsed = urlsplit(target)
                  if parsed.scheme or parsed.netloc:
                      if parsed.scheme != 'https':
                          raise SystemExit(f'Unexpected external scheme: {path}: {target}')
                      continue
                  local = (root / unquote(parsed.path).lstrip('/')) if parsed.path.startswith('/') else (path.parent / unquote(parsed.path) if parsed.path else path)
                  local = local.resolve()
                  if not local.is_relative_to(root) or not local.is_file():
                      raise SystemExit(f'Broken local link: {path}: {target}')
                  if parsed.fragment:
                      body = local.read_text(encoding='utf-8')
                      explicit = set(re.findall(r'<a\s+id=[\"\x27]([^\"\x27]+)', body))
                      headings = set()
                      for heading in re.findall(r'^#{1,6}\s+(.+)$', body, flags=re.M):
                          slug = re.sub(r'[^\w\- ]', '', heading.strip().lower()).replace(' ', '-')
                          headings.add(slug)
                      if unquote(parsed.fragment) not in explicit | headings:
                          raise SystemExit(f'Broken local anchor: {path}: {target}')
                  checked += 1
          landing = Path('.github/README.md').read_text(encoding='utf-8')
          for required in ('# Werkfaden', 'Keep the thread. Verify the change.', 'Yannick Wende', 'kairos_cli.py', 'personal, private, non-commercial', 'not a new sealed software release'):
              if required not in landing:
                  raise SystemExit(f'Missing public contract: {required}')
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          for field in ('repository-code', 'url'):
              if f'{field}: "{canonical}"' not in citation:
                  raise SystemExit(f'Non-canonical citation {field}')
          social = Path('docs/growth/SOCIAL.md').read_text(encoding='utf-8')
          if f'{canonical}/tree/' in social:
              raise SystemExit('Social launch copy must link the public repository root')
          post = social.split('<!-- bluesky:start -->', 1)[1].split('<!-- bluesky:end -->', 1)[0].strip()
          if not post.isascii() or not 0 < len(post) <= 300 or canonical not in post:
              raise SystemExit(f'Bluesky draft requires review: {len(post)} codepoints')
          print(f'PASS: {checked} local links/anchors; no obsolete public repository URLs; canonical citation and social destination; Bluesky draft {len(post)}/300 ASCII characters')
          PY

      - name: Verify unchanged framework bundle
        env:
          PYTHONPATH: kairos/kairos_harness
        run: |
          python - <<'PY'
          from kairos.framework import FRAMEWORK_VERSION, verify_framework_bundle
          result = verify_framework_bundle()
          if not result['verified'] or result['version'] != FRAMEWORK_VERSION:
              raise SystemExit('Framework verification failed')
          print(result)
          PY

      - name: Run existing framework bootstrap regression
        env:
          PYTHONPATH: kairos/kairos_harness
        run: python -m unittest discover -s kairos/kairos_harness/tests -p 'test_framework_bootstrap.py' -v

      - name: Run existing scripted cold bootstrap
        run: python scripts/v3_cold_bootstrap_gate.py

      - name: Assert no tracked bytes changed during validation
        run: git diff --exit-code
