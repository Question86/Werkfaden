name: V3 step1 Workshop integration gate

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

permissions:
  contents: read

jobs:
  step1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q kickstart kairos/kairos_harness workshop/src
      - name: Run full KAIROS harness gate
        env:
          PYTHONPATH: kairos/kairos_harness
        run: python -m unittest discover -s kairos/kairos_harness/tests -p 'test_*.py' -v
      - name: Run full kickstart gate
        run: python -m unittest discover -s kickstart/tests -p 'test_*.py' -v
      - name: Run full Workshop gate
        env:
          PYTHONPATH: workshop/src
        run: python -m unittest discover -s workshop/tests -p 'test_*.py' -v
