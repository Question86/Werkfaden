[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime-sync-workshop"
version = "0.1.0-alpha.2"
description = "Fail-closed Runtime, blueprint, and KAIROS projection synchronization workshop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runtime-sync-workshop = "runtime_sync_workshop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
runtime_sync_workshop = ["quarantine/*.txt"]
